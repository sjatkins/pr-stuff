[project]
name = "py-pr"
version = "0.1.0"
description = "Pydantic models for the Perilous Realms game data"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/classes.py"]
