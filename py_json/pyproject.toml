[project]
name = "py-json"
version = "0.2.0"
description = "Convert Perilous Realms world sources to JSONL"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rooms = "prworld.rooms:main"
world2jsonl = "prworld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/prworld"]
